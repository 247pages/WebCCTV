<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jio / KaiOS Feature Inspector</title>
  <style>
    body { font-family: sans-serif; margin: 8px; padding: 4px; }
    .supported { color: green; }
    .unsupported { color: red; }
    pre { background: #f0f0f0; padding: 8px; border-radius: 4px; }
    button { margin: 6px 0; padding: 8px; width: 100%; }
  </style>
</head>
<body>
  <h2>Feature Inspector for KaiOS / JioPhone</h2>
  <div id="log"></div>
  <button id="btnTestCamera">Test getUserMedia</button>
  <button id="btnTestCapture">Test file-capture fallback</button>
  <pre id="out"></pre>

  <script>
    function log(msg, cls) {
      const d = document.getElementById('log');
      const p = document.createElement('p');
      p.textContent = msg;
      if (cls) p.className = cls;
      d.appendChild(p);
      document.getElementById('out').textContent += msg + '\\n';
    }

    function safeWrapper(fn) {
      try {
        fn();
      } catch (e) {
        log('Error: ' + e.message, 'unsupported');
      }
    }

    // Standard + KaiOS-specific checks
    safeWrapper(() => {
      log('User Agent: ' + navigator.userAgent);
      log('Secure context (HTTPS): ' + (location.protocol === 'https:' ? 'Yes' : 'No'));
      log('navigator.mediaDevices: ' + (!!navigator.mediaDevices));
      log('getUserMedia: ' + (!!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)));
      log('RTCPeerConnection: ' + (!!window.RTCPeerConnection));
      log('WebSocket: ' + (!!window.WebSocket));
      log('fetch: ' + (!!window.fetch));
      log('enumerateDevices: ' + (!!(navigator.mediaDevices && navigator.mediaDevices.enumerateDevices)));
      log('navigator.getFeature: ' + (!!navigator.getFeature));
      log('navigator.hasFeature: ' + (!!navigator.hasFeature));

      // If KaiOS feature API exists, test those
      if (navigator.getFeature) {
        const features = ['camera', 'webrtc', 'rtcDataChannel', 'video', 'mediaDevices'];
        features.forEach(f => {
          try {
            const has = navigator.getFeature(f);
            log('KaiOS navigator.getFeature("' + f + '") = ' + has);
          } catch (e) {
            log('navigator.getFeature("' + f + '") threw: ' + e.message);
          }
        });
      }
      if (navigator.hasFeature) {
        const features = ['camera', 'webrtc', 'getUserMedia'];
        features.forEach(f => {
          const has = navigator.hasFeature(f);
          log('KaiOS navigator.hasFeature("' + f + '") = ' + has);
        });
      }
    });

    // Button: test getUserMedia
    document.getElementById('btnTestCamera').onclick = async () => {
      log('\\n--- Testing getUserMedia() ---');
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        log('getUserMedia not supported');
        return;
      }
      try {
        const constraints = { video: { width: 160, height: 120, frameRate: 10 }, audio: false };
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        log('getUserMedia succeeded. Number of tracks: ' + stream.getTracks().length, 'supported');
        // Optionally show video
        const v = document.createElement('video');
        v.autoplay = true;
        v.muted = true;
        v.style.width = '100%';
        v.srcObject = stream;
        document.body.appendChild(v);
      } catch (err) {
        log('getUserMedia failed: ' + err.name + ' — ' + err.message, 'unsupported');
      }
    };

    // Button: test file-capture fallback
    document.getElementById('btnTestCapture').onclick = () => {
      log('\\n--- Testing file input capture fallback ---');
      const inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = 'image/*';
      inp.capture = 'camera';
      inp.onchange = e => {
        const f = e.target.files && e.target.files[0];
        if (f) {
          log('File selected: ' + f.name + ' (' + f.type + ', ' + f.size + ' bytes)', 'supported');
          const img = document.createElement('img');
          img.src = URL.createObjectURL(f);
          img.style.width = '100%';
          document.body.appendChild(img);
        } else {
          log('No file selected or capture not supported', 'unsupported');
        }
      };
      document.body.appendChild(inp);
      try {
        inp.click();
      } catch (e) {
        log('Failed to open file picker: ' + e.message, 'unsupported');
      }
    };
  </script>
</body>
</html>
