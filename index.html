<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>JioPhone Camera Test</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
  <h2>🎥 Camera Test</h2>
  <video id="vid" autoplay muted playsinline style="width:100%; background:#000"></video>
  <p id="status">Starting...</p>

  <script>
    var status = document.getElementById("status");
    var vid = document.getElementById("vid");

    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ video: true, audio: false })
        .then(function(stream) {
          vid.srcObject = stream;
          status.innerHTML = "✅ Camera started successfully!";
        })
        .catch(function(err) {
          status.innerHTML = "❌ getUserMedia failed: " + err.name + " — " + err.message;
        });
    } else {
      status.innerHTML = "❌ getUserMedia not available at all.";
    }
  </script>
</body>
</html>
