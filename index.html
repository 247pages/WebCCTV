<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>JioPhone Feature Test</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { font-family: sans-serif; font-size: 14px; }
    .ok { color: green; }
    .no { color: red; }
  </style>
</head>
<body>
  <h2>📱 JioPhone Feature Test</h2>
  <script>
    function check(name, test) {
      document.write("<p>" + name + ": " + 
        (test ? "<span class='ok'>✔ Supported</span>" : "<span class='no'>✘ Not Supported</span>") + 
        "</p>");
    }

    document.write("<p>UserAgent: " + navigator.userAgent + "</p>");

    check("navigator.mediaDevices", !!navigator.mediaDevices);
    check("getUserMedia", navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
    check("RTCPeerConnection", window.RTCPeerConnection);
    check("WebSocket", window.WebSocket);
    check("fetch API", window.fetch);
    check("Promise", window.Promise);
    check("File Input Capture", "capture" in document.createElement("input"));
  </script>
  <p>End of test.</p>
</body>
</html>
