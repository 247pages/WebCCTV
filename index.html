<!DOCTYPE html>
<html>
<head>
  <title>JioPhone CCTV</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    video { width: 100%; max-height: 240px; background:#000; }
    textarea { width:100%; height:80px; font-size:12px; }
    button { width:100%; padding:5px; margin-top:5px; }
  </style>
</head>
<body>
  <h3>📹 JioPhone CCTV</h3>
  <video id="local" autoplay muted></video>
  <video id="remote" autoplay></video>
  
  <textarea id="offer"></textarea>
  <button onclick="createOffer()">Create Offer</button>
  
  <textarea id="answer"></textarea>
  <button onclick="setAnswer()">Set Answer</button>
  
  <script>
    let pc = new RTCPeerConnection();
    let local = document.getElementById("local");
    let remote = document.getElementById("remote");

    // Show remote stream
    pc.ontrack = e => { remote.srcObject = e.streams[0]; };

    // Capture camera
    navigator.mediaDevices.getUserMedia({ video: { width:160, height:120, frameRate:10 }, audio:false })
    .then(stream => {
      local.srcObject = stream;
      stream.getTracks().forEach(t => pc.addTrack(t, stream));
    });

    // ICE candidates handling
    let offerBox = document.getElementById("offer");
    let answerBox = document.getElementById("answer");
    pc.onicecandidate = e => {
      if (e.candidate) {
        offerBox.value = JSON.stringify(pc.localDescription);
      }
    };

    async function createOffer(){
      let offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      offerBox.value = JSON.stringify(offer);
    }

    async function setAnswer(){
      let ans = JSON.parse(answerBox.value);
      await pc.setRemoteDescription(new RTCSessionDescription(ans));
    }
  </script>
</body>
</html>
